[tools]
go = "1.27.4"
node = "latest"
gitleaks = "8.30.1"

[env]
CGO_ENABLED = "0"

[tasks.build]
description = "Build henge binary"
# On macOS, the hardened runtime keeps debuggers, and so the commands Codex
# runs, from attaching to henge and reading the keys it holds in memory.
run = """
go build -o henge ./cmd/henge
if [ "$(uname)" = Darwin ]; then codesign --force --sign - --options runtime henge; fi
"""

[tasks.run]
description = "Build and run henge"
depends = ["build"]
run = "./henge"

[tasks.reload]
description = "Rebuild henge and restart the running one once its work is done"
depends = ["build"]
run = 'kill -HUP "$(cat "${HENGE_HOME:-.}/data/state/henge.lock")"'

[tasks.test]
description = "Run tests with race detector"
run = "go test -race ./..."

[tasks.lint]
description = "Run go vet and gofmt check"
run = """
go vet ./...
test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt: files need formatting"; exit 1; }
"""

[tasks.hooks]
description = "Scan staged changes and commit messages before each commit"
run = "git config core.hooksPath .githooks"

[tasks.scan]
description = "Scan every commit for secrets and words in .denylist"
run = ".githooks/scan"

[tasks.vulncheck]
description = "Report known vulnerabilities reachable from the code"
# govulncheck has no option to accept a finding, so its JSON is filtered here.
# GO-2026-6278 (gorilla/websocket mask key PRNG): fixed only on an untagged
# commit that also brings reverted main-branch changes. Remove it from the list
# once a tagged release with the fix ships.
run = """
ignored='GO-2026-6278'
report=$(go run golang.org/x/vuln/cmd/govulncheck@latest -format json ./...) || exit 1
found=$(printf '%s' "$report" | jq -rs '[.[] | .finding? | select(. != null and .trace[0].function != null) | .osv] | unique | .[]') || exit 1
for id in $found; do
  case " $ignored " in
    *" $id "*) echo "accepted: $id (https://pkg.go.dev/vuln/$id)" ;;
    *) echo "vulnerable: $id (https://pkg.go.dev/vuln/$id)"; failed=1 ;;
  esac
done
test -z "$failed" || { echo "Run: go run golang.org/x/vuln/cmd/govulncheck@latest ./..."; exit 1; }
"""
