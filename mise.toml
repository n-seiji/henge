[tools]
go = "1.27.4"
node = "latest"
gitleaks = "8.30.1"

[env]
CGO_ENABLED = "0"

[tasks.build]
description = "Build henge binary"
# On macOS, the hardened runtime keeps debuggers, and so the commands Codex
# runs, from attaching to henge and reading the keys it holds in memory.
run = """
go build -o henge ./cmd/henge
if [ "$(uname)" = Darwin ]; then codesign --force --sign - --options runtime henge; fi
"""

[tasks.run]
description = "Build and run henge"
depends = ["build"]
run = "./henge"

[tasks.reload]
description = "Rebuild henge and restart the running one once its work is done"
depends = ["build"]
run = 'kill -HUP "$(cat "${HENGE_HOME:-.}/data/state/henge.lock")"'

[tasks.test]
description = "Run tests with race detector"
run = "go test -race ./..."

[tasks.lint]
description = "Run go vet and gofmt check"
run = """
go vet ./...
test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt: files need formatting"; exit 1; }
"""

[tasks.hooks]
description = "Scan staged changes and commit messages before each commit"
run = "git config core.hooksPath .githooks"

[tasks.scan]
description = "Scan every commit for secrets and words in .denylist"
run = ".githooks/scan"

[tasks.vulncheck]
description = "Report known vulnerabilities reachable from the code"
run = "go run golang.org/x/vuln/cmd/govulncheck@latest ./..."
